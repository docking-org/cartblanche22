services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        SW_TARBALL: ${SW_TARBALL}
        SW_GIT_KEY: ${SW_GIT_KEY}
        SW_GIT_REPO: ${SW_GIT_REPO}
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    env_file: backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - /dev/null:/dev/null
    depends_on:
      - redis
